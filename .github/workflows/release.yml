name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            cc: gcc
            cflags: ""
          - os: ubuntu-latest
            target: linux-arm64
            cc: aarch64-linux-gnu-gcc
            cflags: ""
            setup: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            cc: clang
            cflags: "-target arm64-apple-macos11"
          - os: macos-latest
            target: darwin-amd64
            cc: clang
            cflags: "-target x86_64-apple-macos10.15"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup cross-compiler
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Build binary
        run: |
          make clean
          if [ -n "${{ matrix.cflags }}" ]; then
            make CC="${{ matrix.cc }}" CFLAGS="-Wall -Wextra -std=c99 -pedantic -D_GNU_SOURCE -Iinclude -O2 ${{ matrix.cflags }}"
          else
            make CC="${{ matrix.cc }}"
          fi

      - name: Package artifacts
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ] || [ "$TAG_NAME" = "master" ]; then
            TAG_NAME="v$(cat VERSION)"
          fi

          mkdir -p dist
          # 1. Standalone binary for direct download & self-update
          cp bin/fdash "dist/fdash-${{ matrix.target }}"
          chmod +x "dist/fdash-${{ matrix.target }}"

          # 2. Compressed tarball archive
          TARBALL="fdash-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          tar -czf "dist/${TARBALL}" -C bin fdash -C .. README.md LICENSE

          # 3. SHA-256 Checksums
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "fdash-${{ matrix.target }}" > "fdash-${{ matrix.target }}.sha256"
            sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          else
            shasum -a 256 "fdash-${{ matrix.target }}" > "fdash-${{ matrix.target }}.sha256"
            shasum -a 256 "${TARBALL}" > "${TARBALL}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate master checksums
        run: |
          cd release-assets
          ls -la
          sha256sum fdash-* > checksums.txt 2>/dev/null || true
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
