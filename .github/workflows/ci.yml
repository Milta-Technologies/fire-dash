name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            install: sudo apt-get update && sudo apt-get install -y libsystemd-dev
          - os: macos-latest
            compiler: clang
            install: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Build with ${{ matrix.compiler }}
        run: |
          make clean
          make CC="${{ matrix.compiler }}"

      - name: Run test suite
        run: |
          make CC="${{ matrix.compiler }}" test

      - name: Test CLI smoke tests
        run: |
          ./bin/fdash --version
          ./bin/fdash --help
          ./bin/fdash list

  sanitizers:
    name: AddressSanitizer & UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsystemd-dev

      - name: Build and test under ASan/UBSan
        run: |
          make clean
          CFLAGS="-Wall -Wextra -pedantic -std=c99 -D_GNU_SOURCE -Iinclude -fsanitize=address,undefined -g" LDFLAGS="-fsanitize=address,undefined" make test
          CFLAGS="-Wall -Wextra -pedantic -std=c99 -D_GNU_SOURCE -Iinclude -fsanitize=address,undefined -g" LDFLAGS="-fsanitize=address,undefined" make

      - name: Test CLI argument buffer handling under ASan
        run: |
          python3 -c 'import subprocess; res = subprocess.run(["./bin/fdash", "list"] + [f"arg{i}" for i in range(100)], capture_output=True, text=True); print(res.stdout); exit(res.returncode)'
